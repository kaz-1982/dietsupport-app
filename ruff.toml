# ruff 設定(CR-001 CI: backend job)
# 目的: ruff のバージョン更新でデフォルト有効ルールが変わっても CI 結果が変わらないよう、
# 適用ルールを明示的に固定する(requirements-dev.txt は ruff>=0.8 と未固定のため、
# 無指定だと ruff 側のデフォルト変更で CI が突然赤くなる)。
# 現在の選択は ruff 0.8 系のデフォルト(pycodestyle の一部 + Pyflakes)。
# ルール追加(UP/I/RUF 等の採用)は別途 CR として検討する。

[lint]
select = ["E4", "E7", "E9", "F"]
